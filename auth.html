<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Portal - Pakistan Horizons</title>
  <meta name="description" content="Sign in or create your Pakistan Horizons account to manage bookings, track custom itineraries, and unlock member discounts.">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

  <!-- Simple Header -->
  <header class="auth-header">
    <div class="container auth-header-container">
      <a href="index.html" class="logo">
        Pakistan<span>Horizons</span>
      </a>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="index.html" class="btn btn-outline btn-sm">← Back to Tours</a>
      </div>
    </div>
  </header>

  <!-- Main Auth Container -->
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-badge">Customer Portal</div>
        <h2 id="authHeading">Welcome Back</h2>
        <p id="authSubheading" style="color: var(--text-muted); font-size: 0.95rem;">
          Sign in to manage your bookings and view live itineraries.
        </p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabSignInBtn">Sign In</button>
        <button class="auth-tab" id="tabSignUpBtn">Create Account</button>
      </div>

      <!-- Google OAuth Button -->
      <button class="btn btn-google" id="googleLoginBtn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-divider">
        <span>or continue with email</span>
      </div>

      <!-- Sign In Form -->
      <form id="signInForm" class="auth-form active">
        <div class="search-field">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="yourname@gmail.com" required>
        </div>

        <div class="search-field" style="margin-top: 1rem;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="loginPassword">Password</label>
            <a href="#" id="forgotPassLink" style="font-size: 0.82rem; color: var(--primary); font-weight: 600;">Forgot Password?</a>
          </div>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1.5rem;">
          Sign In to Account
        </button>
      </form>

      <!-- Sign Up Form -->
      <form id="signUpForm" class="auth-form">
        <div class="search-field">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="e.g. Sarah Khan" required>
        </div>

        <div class="search-field" style="margin-top: 1rem;">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="yourname@gmail.com" required>
        </div>

        <div class="search-field" style="margin-top: 1rem;">
          <label for="regPassword">Create Password</label>
          <input type="password" id="regPassword" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <div class="search-field" style="margin-top: 1rem;">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" placeholder="Repeat password" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-accent btn-lg" style="width: 100%; margin-top: 1.5rem;">
          Create Free Account
        </button>
      </form>

      <!-- User Dashboard Quick Preview (If Logged In) -->
      <div id="authProfileCard" class="auth-profile-card" style="display: none;">
        <div class="profile-avatar" id="profAvatar">U</div>
        <h3 id="profName">User Name</h3>
        <p id="profEmail" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem;">user@example.com</p>
        
        <div style="background: var(--bg-surface); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1.5rem; text-align: left;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem;">
            <span>Account Status:</span>
            <strong style="color: #10b981;">✓ Verified Traveler</strong>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
            <span>Member Rewards:</span>
            <strong style="color: var(--primary);">5% Auto-Discount</strong>
          </div>
        </div>

        <div style="display: flex; gap: 0.75rem; flex-direction: column;">
          <a href="index.html" class="btn btn-primary" style="width: 100%;">Explore Tours & Book</a>
          <button id="authLogoutBtn" class="btn btn-outline" style="width: 100%; color: #ef4444; border-color: #ef4444;">Sign Out</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabSignIn = document.getElementById('tabSignInBtn');
      const tabSignUp = document.getElementById('tabSignUpBtn');
      const signInForm = document.getElementById('signInForm');
      const signUpForm = document.getElementById('signUpForm');
      const heading = document.getElementById('authHeading');
      const subheading = document.getElementById('authSubheading');
      const profileCard = document.getElementById('authProfileCard');
      const googleBtn = document.getElementById('googleLoginBtn');
      const logoutBtn = document.getElementById('authLogoutBtn');

      function switchTab(tab) {
        if (tab === 'signup') {
          tabSignUp.classList.add('active');
          tabSignIn.classList.remove('active');
          signUpForm.classList.add('active');
          signInForm.classList.remove('active');
          heading.textContent = 'Join Pakistan Horizons';
          subheading.textContent = 'Create your free account to track bookings & get member discounts.';
        } else {
          tabSignIn.classList.add('active');
          tabSignUp.classList.remove('active');
          signInForm.classList.add('active');
          signUpForm.classList.remove('active');
          heading.textContent = 'Welcome Back';
          subheading.textContent = 'Sign in to manage your bookings and view live itineraries.';
        }
      }

      tabSignIn?.addEventListener('click', () => switchTab('signin'));
      tabSignUp?.addEventListener('click', () => switchTab('signup'));

      // Check current user state
      if (window.PHAuth) {
        window.PHAuth.onAuthStateChanged(user => {
          if (user) {
            signInForm.style.display = 'none';
            signUpForm.style.display = 'none';
            document.querySelector('.auth-tabs').style.display = 'none';
            document.querySelector('.btn-google').style.display = 'none';
            document.querySelector('.auth-divider').style.display = 'none';
            profileCard.style.display = 'block';

            heading.textContent = 'My Account';
            subheading.textContent = 'Manage your profile and reservations.';
            document.getElementById('profName').textContent = user.displayName || 'Traveler';
            document.getElementById('profEmail').textContent = user.email || '';
            document.getElementById('profAvatar').textContent = (user.displayName || 'U').charAt(0).toUpperCase();
          } else {
            signInForm.style.display = 'block';
            signUpForm.style.display = 'none';
            document.querySelector('.auth-tabs').style.display = 'flex';
            document.querySelector('.btn-google').style.display = 'flex';
            document.querySelector('.auth-divider').style.display = 'flex';
            profileCard.style.display = 'none';
            switchTab('signin');
          }
        });
      }

      // Handle Sign In
      signInForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPassword').value;

        try {
          const user = await window.PHAuth.loginUser(email, pass);
          showToast(`Welcome back, ${user.displayName}!`, 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      // Handle Sign Up
      signUpForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPassword').value;
        const confirmPass = document.getElementById('regConfirmPassword').value;

        if (pass !== confirmPass) {
          showToast('Passwords do not match. Please re-enter.', 'error');
          return;
        }

        try {
          const user = await window.PHAuth.registerUser(name, email, pass);
          showToast(`Account created! Welcome, ${user.displayName}.`, 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      // Handle Google Login
      googleBtn?.addEventListener('click', async () => {
        try {
          const user = await window.PHAuth.loginWithGoogle();
          showToast(`Signed in with Google as ${user.displayName}!`, 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      // Handle Logout
      logoutBtn?.addEventListener('click', async () => {
        await window.PHAuth.logoutUser();
        showToast('You have been signed out.', 'info');
      });

      // Handle Forgot Password
      document.getElementById('forgotPassLink')?.addEventListener('click', (e) => {
        e.preventDefault();
        const email = prompt('Enter your registered email address for password reset:');
        if (email) {
          showToast(`Password reset link dispatched to ${email}`, 'success');
        }
      });
    });
  </script>
</body>
</html>
